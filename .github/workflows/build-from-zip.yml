name: Build APK from uploaded ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'FastClickerMicro-source.zip'
      - '.github/workflows/build-from-zip.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK and NDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack source ZIP
        run: unzip -q FastClickerMicro-source.zip -d unpacked
      - name: Build debug APK
        run: gradle -p unpacked/FastClickerMicro :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FastClickerMicro-debug-apk
          path: unpacked/FastClickerMicro/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
